name: Android CI — Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  REXSDK_COMMIT: f5337cdc947ff6d4c4196737e2c807a48f2a1fc2

jobs:
  build:
    name: Build Real Steel Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RealSteelRecomp
        uses: actions/checkout@v4
        with:
          fetch-tags: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Clone ReXGlue SDK
        run: |
          git -c core.autocrlf=false clone \
            --no-checkout \
            https://github.com/rexglue/rexglue-sdk.git \
            thirdparty/rexglue-sdk

          git -C thirdparty/rexglue-sdk \
            -c core.autocrlf=false checkout \
            "$REXSDK_COMMIT"

          git -C thirdparty/rexglue-sdk \
            -c core.autocrlf=false submodule update \
            --init --recursive

      - name: Apply ReXGlue house patch
        run: |
          git -C thirdparty/rexglue-sdk \
            apply \
            --whitespace=nowarn \
            --ignore-whitespace \
            "$GITHUB_WORKSPACE/patches/house-sdk.patch"

      - name: Verify SDK
        run: |
          test -f thirdparty/rexglue-sdk/CMakeLists.txt
          test -f generated/rexglue.cmake
          test -d generated/default
          echo "ReXGlue SDK:"
          git -C thirdparty/rexglue-sdk rev-parse HEAD

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build native Android library
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
        run: |
          ./gradlew \
            --no-daemon \
            :app:externalNativeBuildDebug

      - name: Show native libraries
        run: |
          find android/app/build -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew \
            --no-daemon \
            assembleDebug

      - name: Verify APK
        run: |
          find android/app/build/outputs \
            -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: realsteel-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error